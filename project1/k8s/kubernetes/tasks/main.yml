---
- name: disable swap
  ansible.builtin.command: swapoff -a
  become: true

# - name: Ensure swap is disabled on boot
#   ansible.builtin.replace:
#     path: /etc/fstab
#     regexp: '^([^#]*\s+swap\s+.*)$'
#     replace: '# \1'

- name: Install required packages
  ansible.builtin.package:
    name:
      - apt-transport-https
      - ca-certificates
      - python3-dnf-plugin-versionlock
      #- curl

- name: load modules
  ansible.builtin.command: sudo modprobe overlay && sudo modprobe br_netfilter 

- name: Script for load moduels at reboot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
  become: true


- name: Load modules using sysctl
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  become: true

- name: Set sysctl params
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.ipv4.ip_forward                 = 1
      net.bridge.bridge-nf-call-ip6tables = 1
  become: true  


- name: Export kubernetes version variable
  ansible.builtin.set_fact:
    k8s_version: "1.29"

- name: Env version
  ansible.builtin.shell: echo "VERSION={{ k8s_version }}" >> /etc/environment
  become: true
   
- name: Add Kubernetes apt repository
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes Repository
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/"
    gpgcheck: 1
    gpgkey: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/repodata/repomd.xml.key
    
    repo_gpgcheck: 1
    enabled: 1
    state: present    
  become: true

- name: Install Kubernetes packages
  ansible.builtin.package:
    name: 
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes    
  become: true 
- name: Enable and start kubelet service
  ansible.builtin.service: 
    name: kubelet
    enabled: true
    state: started
  become: true

- name: Hold Kubernetes packages at current version
  ansible.builtin.command: "dnf versionlock add kubelet kubeadm kubectl"
  become: true    

- name: Add Docker CE repository
  ansible.builtin.yum_repository:
    name: docker-ce
    description: Docker CE Repository
    baseurl: https://download.docker.com/linux/centos/9/$basearch/stable
    gpgcheck: 1
    gpgkey: https://download.docker.com/linux/centos/gpg
    repo_gpgcheck: 1
    enabled: 1
    state: present    
  become: true

- name: Install containerd
  ansible.builtin.package:
    name: containerd.io 
    state: present
  become: true 

- name: Create containerd configuration directory
  ansible.builtin.file: 
    path: /etc/containerd
    state: directory
    mode: '0755'
  become: true  

- name: Generate default containerd configuration file
  ansible.builtin.command: containerd config default > /etc/containerd/config.toml
  become: true  

- name: Comment out cri plugin
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*disabled_plugins = \["cri"\])'
    replace: '#'

- name: Restart containerd to apply new configuration
  ansible.builtin.service: 
    name: containerd
    state: restarted  

- name: Enable containerd service
  ansible.builtin.service:
    name: containerd
    enabled: true
    state: started
  become: true  
- name: generate containerd 
  command: sudo containerd config default | sudo tee /etc/containerd/config.toml
  become: true

- name: Set cgroup driver to systemd for containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  become: true

- name: Restart containerd to apply cgroup driver change
  ansible.builtin.service: 
    name: containerd
    state: restarted  
  become: true


- name: Verify containerd is running
  ansible.builtin.command: systemctl status containerd  
  register: containerd_status   

- name: Display containerd status
  ansible.builtin.debug:
    var: containerd_status.stdout_lines 

- name: Load environment variables
  ansible.builtin.shell: source /etc/environment
  become: true 

# - name: Pull images required by kubeadm
#   ansible.builtin.command: sudo kubeadm config images pull
#   become: true

- name: Initialize Kubernetes cluster with kubeadm
  ansible.builtin.command: sudo kubeadm init --kubernetes-version v1.29.4 --pod-network-cidr=192.168.10.0/16 --control-plane-endpoint ${HOSTNAME}

