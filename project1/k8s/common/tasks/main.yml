# tasks file for common
- name: disable swap temporarily
  command: swapoff -a
  become: true

- name: disable swap permanently (comment out fstab swap entries)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '(^.*\sswap\s.*$)'
    replace: '# \\1'
    backup: yes
  become: true

- name: Install required packages (apt)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-apt
      - curl
    update_cache: true
    state: present
  become: true

- name: Ensure kernel modules are loaded now
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  become: true

- name: Load modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Persist sysctl settings for k8s
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.ipv4.ip_forward                 = 1
      net.bridge.bridge-nf-call-ip6tables = 1
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Apply required sysctl settings immediately
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
  become: true


- name: containerd installation
  ansible.builtin.package:
    name:
      - containerd
  become: true  

- name: Configure containerd
  command: |
    mkdir -p /etc/containerd  
  become: true 

- name: Generate default containerd configuration file
  command: containerd config default > /etc/containerd/config.toml
  become: true  

- name: Restart containerd  
  ansible.builtin.service:
    name: containerd
    state: restarted
    enabled: true
  become: true  

- name: Setup Kubernetes apt repository keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Download Kubernetes apt repository key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring
    mode: '0644'
  become: true

- name: Convert Release.key to gpg keyring
  command: |
     gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /etc/apt/keyrings/kubernetes-apt-keyring
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  become: true

- name: Add Kubernetes apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: '0644'
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /
  become: true

- name: Update apt package index
  ansible.builtin.apt:
    update_cache: yes
  become: true

- name: Install Kubernetes packages
  ansible.builtin.package:
    name: 
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes    
  become: true

- name: Enable and start kubelet service
  ansible.builtin.service: 
    name: kubelet
    enabled: true
    state: started
  become: true

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true