# tasks file for common
- name: disable swap temporarily
  command: swapoff -a
  become: true

- name: disable swap permanently (comment out fstab swap entries)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '(^.*\sswap\s.*$)'
    replace: '# \\1'
    backup: yes
  become: true

- name: Install required packages (apt)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-apt
      - curl
    update_cache: true
    state: present
  become: true

- name: Ensure kernel modules are loaded now
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  become: true

- name: Load modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Persist sysctl settings for k8s
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.ipv4.ip_forward                 = 1
      net.bridge.bridge-nf-call-ip6tables = 1
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Apply required sysctl settings immediately
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
  become: true